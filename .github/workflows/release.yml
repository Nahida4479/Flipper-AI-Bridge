name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
      stable:
        description: "Publish as a stable release (not a beta), even when run from the beta branch"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secrets set. The APK is signed with a temporary key and cannot be installed over a previous version."
          fi
      - name: Build APK
        working-directory: android-app
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gradle :app:assembleDebug --stacktrace -PappVersion="${TAG#v}" -PappVersionCode="${{ github.run_number }}"
      - name: Collect
        run: |
          mkdir out
          cp android-app/app/build/outputs/apk/debug/*.apk out/flipper-ai-bridge.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out

  fap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: printf '#pragma once\n\n#define APP_VERSION "%s"\n' "${TAG#v}" > flipper-app/app_version.h
      - name: Build .fap
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          app-dir: flipper-app
          sdk-channel: release
      - name: Collect
        run: |
          mkdir -p out
          FAP=$(find . -name ai_bridge.fap -not -path "./release/*" | head -n 1)
          cp "$FAP" out/ai_bridge.fap
      - uses: actions/upload-artifact@v4
        with:
          name: fap
          path: out

  release:
    needs: [apk, fap]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create checksums
        working-directory: assets
        run: sha256sum flipper-ai-bridge.apk ai_bridge.fap > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: ${{ github.ref_name == 'beta' && github.event.inputs.stable != 'true' }}
          make_latest: ${{ github.event.inputs.stable == 'true' }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: assets/*
