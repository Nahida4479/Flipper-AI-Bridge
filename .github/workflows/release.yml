name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace
      - name: Collect
        run: |
          mkdir out
          cp android-app/app/build/outputs/apk/debug/*.apk out/flipper-claude-bridge.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out

  fap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .fap
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          app-dir: flipper-app
          sdk-channel: release
      - name: Collect
        run: |
          mkdir -p out sdcard/apps/Tools sdcard/apps_assets/claude_bridge
          FAP=$(find . -name claude_bridge.fap -not -path "./release/*" | head -n 1)
          cp "$FAP" out/claude_bridge.fap
          cp "$FAP" sdcard/apps/Tools/
          cp -r flipper-app/assets/dict sdcard/apps_assets/claude_bridge/
          (cd sdcard && zip -r ../out/flipper-sdcard-files.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: fap
          path: out

  release:
    needs: [apk, fap]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: assets/*
