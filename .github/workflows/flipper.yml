name: Build Flipper app

on:
  push:
    branches: [main, beta]
    paths:
      - "flipper-app/**"
      - ".github/workflows/flipper.yml"
  pull_request:
    paths:
      - "flipper-app/**"
  workflow_dispatch:

jobs:
  fap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .fap
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build
        with:
          app-dir: flipper-app
          sdk-channel: release

      - name: Collect .fap
        run: |
          mkdir -p out
          FAP=$(find . -name claude_bridge.fap | head -n 1)
          cp "$FAP" out/claude_bridge.fap

      - uses: actions/upload-artifact@v4
        with:
          name: claude_bridge-fap
          path: out/claude_bridge.fap
          if-no-files-found: error
